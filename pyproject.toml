[project]
name = "text-tune-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.1",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "torch>=2.10.0",
    "unsloth>=2026.3.2",
    "errant>=3.0.0",
    "nltk>=3.9.2",
    "peft>=0.18.0",
    "textdistance>=4.6.3",
    "transformers>=5.2.0",
    "dvc>=3.66.1",
    "pip>=26.0.1",
]


[[tool.uv.index]]
name = "pytorch-cpu"  
url = "https://download.pytorch.org/whl/cpu"  
explicit = true  

[[tool.uv.index]] 
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[tool.uv.sources]
torch = [  
    { index = "pytorch-cpu", extra = "cpu" },  
    { index = "pytorch-cu130", extra = "gpu" },   
]


[project.optional-dependencies]  
cpu = [  
    "torch>=2.10.0",  
]  
gpu = [  
    "torch>=2.10.0",  
]  


[tool.uv]
link-mode = "copy"  
conflicts = [  
    [  
        { extra = "cpu" },  
        { extra = "gpu" },  
    ],  
]  


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
